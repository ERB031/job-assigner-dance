<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Job Assigner</title>
  </head>
  <body>
    <div id="root">
      <div id="loading-msg" style="padding:20px;font-family:sans-serif;color:#333;">
        <p>Loading Job Assigner...</p>
      </div>
    </div>
    <script type="module">
      try {
        await import('./src/main.jsx');
      } catch (err) {
        document.getElementById('root').innerHTML =
          '<div style="padding:20px;color:red;font-family:monospace;white-space:pre-wrap;word-break:break-word;">' +
          '<h2>Error</h2><p>' + (err.message || err) + '</p><pre>' + (err.stack || '') + '</pre></div>';
      }
    </script>
  </body>
</html>
