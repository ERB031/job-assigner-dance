<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Job Assigner</title>
  </head>
  <body>
    <div id="root">
      <div id="loading-msg" style="padding:20px;font-family:sans-serif;color:#333;">
        <p>Loading Job Assigner...</p>
      </div>
    </div>
    <script>
      // Catch any JS errors and display them on screen
      window.onerror = function(msg, src, line, col, err) {
        var el = document.getElementById('loading-msg') || document.createElement('div');
        el.id = 'error-display';
        el.style.cssText = 'padding:20px;font-family:monospace;color:red;white-space:pre-wrap;word-break:break-word;';
        el.innerHTML = '<h2>Error</h2><p>' + msg + '</p><p>Source: ' + src + ':' + line + ':' + col + '</p>';
        if (!el.parentNode) document.body.prepend(el);
      };
      window.addEventListener('unhandledrejection', function(e) {
        var el = document.getElementById('loading-msg') || document.createElement('div');
        el.id = 'error-display';
        el.style.cssText = 'padding:20px;font-family:monospace;color:red;white-space:pre-wrap;word-break:break-word;';
        el.innerHTML = '<h2>Error</h2><p>' + (e.reason && e.reason.message || e.reason || 'Unknown') + '</p><p>' + (e.reason && e.reason.stack || '') + '</p>';
        if (!el.parentNode) document.body.prepend(el);
      });
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
